<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RICOCHET DUEL</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="eyebrow">REAL-TIME ONLINE GAME</div><h1>RICOCHET <span>DUEL</span></h1><p class="sub">弾をはじき返して、相手のゴールを狙え。</p></header>
<section id="lobby" class="panel"><h2>対戦ルーム</h2><label>プレイヤー名<input id="playerName" maxlength="14" value="Player"></label><div class="actions"><button id="createBtn" class="primary">ルームを作成</button><div class="join"><input id="roomCode" maxlength="4" placeholder="コード"><button id="joinBtn">参加する</button></div></div><p id="lobbyMessage" class="message">ルームを作成するか、友達のコードを入力してください。</p><div class="howto"><b>操作方法</b><span>マウス / タッチ / ↑ ↓ キーでバーを移動</span><span>オーナーが試合を開始。次のラウンドは画面タップまたはSPACE</span></div></section>
<section id="game" class="game hidden"><div class="gamebar"><div><small>ROOM</small><strong id="activeCode">----</strong></div><div class="score"><strong id="score">0 : 0</strong><small id="status">対戦相手を待っています</small></div><button id="copyBtn" class="subtle">コードをコピー</button></div><div class="arena-wrap"><canvas id="arena" width="900" height="520"></canvas><div id="overlay" class="overlay">対戦相手を待っています…</div><div id="fx" class="fx"></div></div><div class="below"><span id="playerLabels">YOU VS OPPONENT</span><button id="leaveBtn" class="subtle">ロビーに戻る</button></div>
<section id="ownerPanel" class="panel owner hidden"><div class="ownerHead"><h2>オーナーコントロール</h2><span id="ownerState">待機中</span></div><div class="ownerActions"><button id="startBtn" class="primary">試合開始</button><button id="endBtn">試合終了</button><button id="resetBtn" class="danger">ポイントリセット</button></div><details id="settings" open><summary>ゲーム設定</summary><div class="settingsGrid">
<label>弾の速度 <output id="speedOut">5.2</output><input id="ballSpeed" type="range" min="1" max="12" step=".2" value="5.2"></label><label class="check"><input id="accelerationOn" type="checkbox" checked>加速を有効にする</label><label>加速度倍率 <output id="accelOut">1.035</output><input id="acceleration" type="range" min="1" max="1.2" step=".005" value="1.035"></label><label>試合形式<select id="mode"><option value="rounds">ラウンド数</option><option value="time">制限時間（分）</option></select></label><label>ラウンド数 / 制限時間<input id="limit" type="number" min="1" max="99" value="5"></label><label>スタート時の弾の数<input id="startBalls" type="number" min="1" max="12" value="1"></label><label class="check"><input id="multiplyBalls" type="checkbox">バーに当たると弾が増える</label><label>増え方<select id="growthMode"><option value="add">毎回、指定数を追加</option><option value="multiply">指定倍率で増加</option></select></label><label>追加数 / 倍率<input id="growthAmount" type="number" min="1" max="5" step=".5" value="1"></label><label class="check"><input id="exponential" type="checkbox">指数関数的に増やす（2倍）</label><label>弾の大きさ <output id="sizeOut">10</output><input id="ballSize" type="range" min="5" max="22" value="10"></label><label>アクセントカラー<input id="accent" type="color" value="#55e6dc"></label><label>背景色<input id="background" type="color" value="#0b1729"></label></div><div class="settingsFoot"><small id="settingsHint">試合開始前・終了後に設定できます。</small><button id="saveSettings" class="primary">設定を保存</button></div></details></section></section><footer>1対1オンライン対戦 ・ ルームコードを共有して遊ぼう</footer></main><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
